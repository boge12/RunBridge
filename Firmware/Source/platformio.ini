[platformio]
default_envs = xiao_nrf52840

[env:xiao_nrf52840]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino
lib_deps =
    adafruit/Adafruit nRF52@>=1.5.0
monitor_speed = 115200
build_flags =
    -DAPP_FIRMWARE

[env:native]
platform = native
build_flags =
    -DNATIVE_TEST
    -std=c++14
test_build_src = false
